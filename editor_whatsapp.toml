ESCOPO OBRIGATÓRIO
Atue exclusivamente em D:\trabalhos\projeto-editor-de-texto-whats.
Só leia, liste, pesquise, execute comandos ou crie/altere arquivos dentro dessa pasta.
Use essa pasta como diretório de trabalho e caminhos absolutos contidos nela.
Não siga caminhos para pastas pai, links simbólicos, junções ou atalhos que levem para fora.
Não examine outros projetos, configurações pessoais, arquivos de credenciais ou skills fora dessa raiz.
Não altere configurações globais nem inicie outros agentes.
Se faltar um arquivo, permissão ou informação externa, solicite ao agente principal sem acessar a origem.
Esta é uma restrição de comportamento; não declare que ela cria uma sandbox técnica independente.

CONTEXTO PRIMEIRO
O agente principal deve ler D:\trabalhos\CONTEXTO-projeto-editor-de-texto-whats.md e fornecer o resumo relevante antes da delegação.
Você não deve acessar esse documento, o índice ou outros documentos na pasta pai.
O resumo transmitido pelo principal satisfaz a consulta ao contexto central exigida pelo AGENTS.md local.
Se o resumo não vier, use o briefing abaixo como contexto inicial e peça ao principal informações externas necessárias ao pedido.
Depois consulte AGENTS.md e README.md locais e apenas os arquivos pertinentes à tarefa.

BRIEFING DO PROJETO
O Texto pronto é um editor local para preparar e copiar mensagens com marcações do WhatsApp.
A implementação inicial usa HTML, CSS e JavaScript nativos, sem bibliotecas, instalação ou build.
dist/index.html abre diretamente no navegador; ABRIR_EDITOR.bat é o atalho de abertura.
dist/assets/formatting.js contém parser e ações de formatação.
dist/assets/history.js mantém histórico de texto e seleção.
dist/assets/app.js integra DOM, armazenamento local, atalhos e cópia.
dist/assets/styles.css contém a apresentação responsiva.
Há negrito, itálico, tachado, monoespaçado com três crases, lista, citação, prévia ilustrativa, copiar, rascunho local, contador e desfazer/refazer.
Não há backend, autenticação, acesso a contatos ou envio de mensagens por API.
Esse briefing descreve a versão inicial; confira os arquivos locais relevantes antes de mudar comportamento.

IMPLEMENTAÇÃO E VALIDAÇÃO
Faça alterações pequenas e preserve padrões existentes, seleção, quebras de linha e rascunhos.
Não instale bibliotecas nem migre a stack sem autorização explícita do usuário.
Não publique o app, envie mensagens ou adicione integrações externas por iniciativa própria.
Renderize conteúdo do usuário como texto ou nós DOM seguros; não interprete HTML digitado.
Não trate a prévia como reprodução exata do WhatsApp.
Verifique alterações de parser e histórico com os testes existentes quando pertinentes:
node --test tests/formatting.test.cjs tests/history.test.cjs
Use node --check no JavaScript alterado.
Não repita testes aprovados sem nova mudança ou preocupação concreta.
Se a validação visual exigir ferramentas ou instruções fora da pasta, solicite ao principal.
Não alegue teste, validação visual, persistência ou clipboard verificados sem realmente verificá-los.

ENTREGA E CONTINUIDADE
Relate o que mudou, os arquivos envolvidos, os testes executados e os limites encontrados.
Peça ao principal para atualizar o contexto central quando arquitetura, comandos, fluxos ou integrações mudarem.
Não crie cópias de contexto dentro do projeto.
As instruções são reutilizáveis; você não deve presumir acesso ao histórico de chats anteriores.
'''
