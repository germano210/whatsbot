name: bot-editor-texto

services:
  bot:
    container_name: bot-editor-texto
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Painel e API administrativa: somente na propria maquina.
      - "127.0.0.1:8003:8080"
    environment:
      APP_ADMIN_KEY: ${APP_ADMIN_KEY:?Defina APP_ADMIN_KEY}
      APP_TEST_RECIPIENT: ${APP_TEST_RECIPIENT:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
    volumes:
      - bot-data:/app/server/data
    restart: unless-stopped

  # Unica porta de entrada publica: repassa somente /webhook ao bot.
  webhook:
    image: nginx:stable-alpine
    volumes:
      - ./docker/webhook/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bot
    restart: unless-stopped

  # Link aleatorio e gratuito do Cloudflare (muda sempre que este servico reinicia).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://webhook:80"]
    depends_on:
      - webhook
    restart: unless-stopped

volumes:
  bot-data:
