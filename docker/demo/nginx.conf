server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "connect-src 'none'; form-action 'none'; base-uri 'self'" always;

    location /api/ {
        return 404;
    }

    location = /webhook {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
