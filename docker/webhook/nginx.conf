server {
    listen 80;
    client_max_body_size 1m;

    # Somente o webhook da Meta chega ao bot. Painel e /api ficam fora da internet.
    location = /webhook {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
